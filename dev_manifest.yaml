# Source: yas-all/charts/yas-configuration/templates/yas-configurations.configmap.yaml
#Configmap of general application config for all microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: yas-configuration-configmap
  annotations:
    reloader.stakater.com/match: "true"
data:
  application.yaml: |
    logging:
      pattern:
        level: application=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-}
          level=%level
    management:
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      endpoints:
        web:
          exposure:
            include: prometheus, health
      health:
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
      metrics:
        tags:
          application: ${spring.application.name}
      otlp:
        tracing:
          endpoint: http://opentelemetry-collector.observability:4318/v1/traces
      server:
        port: 8090
      tracing:
        sampling:
          probability: 1
    server:
      port: 80
      shutdown: graceful
    spring:
      datasource:
        password: ${POSTGRESQL_PASSWORD}
        url: null
        username: ${POSTGRESQL_USERNAME}
      kafka:
        bootstrap-servers: kafka-cluster-kafka-brokers.kafka:9092
        consumer:
          bootstrap-servers: kafka-cluster-kafka-brokers.kafka:9092
      lifecycle:
        timeout-per-shutdown-phase: 30s
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://identity.yas.local.com/realms/Yas
    springdoc:
      oauthflow:
        authorization-url: http://identity.yas.local.com/realms/Yas/protocol/openid-connect/auth
        token-url: http://identity.yas.local.com/realms/Yas/protocol/openid-connect/token
    yas:
      services:
        cart: http://cart/cart
        customer: http://customer/customer
        inventory: http://inventory/inventory
        location: http://location/location
        media: http://media/media
        order: http://order/order
        payment: http://payment/payment
        payment-paypal: http://payment-paypal/payment-paypal
        product: http://product/product
        promotion: http://promotion/promotion
        rating: http://rating/rating
        recommendation: http://recommendation/recommendation
        sampledata: http://sampledata/sampledata
        search: http://search/search
        tax: http://tax/tax
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8" ?>
    <Configuration>
        <include resource="org/springframework/boot/logging/logback/defaults.xml" />
        <include resource="org/springframework/boot/logging/logback/console-appender.xml" />
        <property name="LOG_LEVEL" value="${LOG_LEVEL:-INFO}"/>
        <root level="INFO">
            <appender-ref ref="CONSOLE" />
        </root>
        <logger name="com.yas" level="${LOG_LEVEL}" additivity="false">
            <appender-ref ref="CONSOLE" />
        </logger>
    </Configuration>
---
# Source: yas-all/charts/yas-configuration/templates/yas-configurations.configmap.yaml
#Configmap of gateway routes config for bff microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: yas-gateway-routes-config-configmap
  annotations:
    reloader.stakater.com/match: "true"
data:
  gateway-routes-config.yaml: |
    spring:
      cloud:
        gateway:
          routes:
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: product_api
            predicates:
            - Path=/api/product/**
            uri: http://product
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: location_api
            predicates:
            - Path=/api/location/**
            uri: http://location
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: inventory_api
            predicates:
            - Path=/api/inventory/**
            uri: http://inventory
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: cart_api
            predicates:
            - Path=/api/cart/**
            uri: http://cart
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: customer_api
            predicates:
            - Path=/api/customer/**
            uri: http://customer
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: media_api
            predicates:
            - Path=/api/media/**
            uri: http://media
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: rating_api
            predicates:
            - Path=/api/rating/**
            uri: http://rating
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: tax_api
            predicates:
            - Path=/api/tax/**
            uri: http://tax
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: promotion_api
            predicates:
            - Path=/api/promotion/**
            uri: http://protion
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: search_api
            predicates:
            - Path=/api/search/**
            uri: http://search
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: order_api
            predicates:
            - Path=/api/order/**
            uri: http://order
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: recommendation_api
            predicates:
            - Path=/api/recommendation/**
            uri: http://recommendation
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: webhook_api
            predicates:
            - Path=/api/webhook/**
            uri: http://webhook
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: sampledata_api
            predicates:
            - Path=/api/sampledata/**
            uri: http://sampledata
          - id: ui
            predicates:
            - Path=/**
            uri: ${UI_HOST}
