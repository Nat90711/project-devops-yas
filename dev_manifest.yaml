# Source: yas-all/charts/backoffice-bff/charts/backend/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-bff
  labels:
    helm.sh/chart: backend-0.1.0
    app.kubernetes.io/name: backoffice-bff
    app.kubernetes.io/instance: yas-dev
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
  annotations:
    configmap.reloader.stakater.com/reload: yas-gateway-routes-config-configmap,backoffice-bff-extra-configmap
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice-bff
      app.kubernetes.io/instance: yas-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice-bff
        app.kubernetes.io/instance: yas-dev
    spec:
      serviceAccountName: backoffice-bff
      securityContext:
        {}
      volumes:
        - name: yas-configuration
          configMap:
            name: yas-configuration-configmap
        - configMap:
            name: yas-gateway-routes-config-configmap
          name: yas-gateway-routes-config
        - configMap:
            name: backoffice-bff-extra-configmap
          name: backoffice-bff-extra-config
      containers:
        - name: backoffice-bff
          securityContext:
            {}
          image: "ghcr.io/nashtech-garage/yas-backoffice-bff:latest"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: yas-postgresql-credentials-secret
            - secretRef:
                name: yas-keycloak-credentials-secret
            - secretRef:
                name: yas-redis-credentials-secret
          env:
            - name: LOGGING_CONFIG
              value: /opt/yas/config/logback.xml
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql.postgres:5432/postgres
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /opt/yas/config/application.yaml,/opt/yas/gateway-routes-config/gateway-routes-config.yaml,/opt/yas/extra-config/backoffice-bff-extra-config.yaml
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: UI_HOST
              value: http://backoffice-ui:3000
          volumeMounts:
            - mountPath: /opt/yas/config
              name: yas-configuration
            - mountPath: /opt/yas/gateway-routes-config
              name: yas-gateway-routes-config
            - mountPath: /opt/yas/extra-config
              name: backoffice-bff-extra-config
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: metric
              containerPort: 8090
          lifecycle:
            
            preStop:
              exec:
                command:
                - sh
                - -c
                - sleep 10
          livenessProbe:
            failureThreshold: 12
            httpGet:
              path: /actuator/health/liveness
              port: metric
            periodSeconds: 10
            successThreshold: 1
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /actuator/health/readiness
              port: metric
            periodSeconds: 10
            successThreshold: 1
          resources:
            {}
      terminationGracePeriodSeconds: 45
---
