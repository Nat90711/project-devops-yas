apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/description: "YAS Dev environment - auto synced on every main branch push"
spec:
  project: default
  source:
    repoURL: https://github.com/Nat90711/project-devops-yas
    targetRevision: gitops
    path: k8s/charts/yas-all              # ← SỬA: trỏ vào umbrella chart
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml  # ← SỬA: đường dẫn relative từ chart path
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # ← SỬA: tắt selfHeal tránh tự bật lại pods (QUY_TAC_RAM_K8S.md)
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true