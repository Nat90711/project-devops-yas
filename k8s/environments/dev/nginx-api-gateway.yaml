apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-api-config
  namespace: dev
data:
  default.conf: |
    server {
      listen 80;

      # Kubernetes CoreDNS
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      location /media/ {
        proxy_pass http://media;
      }
      location /swagger-ui/ {
        proxy_pass http://swagger-ui:8080;
      }
      location /product/ {
        proxy_pass http://product;
      }
      location /customer/ {
        proxy_pass http://customer;
      }
      location /cart/ {
        proxy_pass http://cart;
      }
      location /rating/ {
        proxy_pass http://rating;
      }
      location /order/ {
        proxy_pass http://order;
      }
      location /location/ {
        proxy_pass http://location;
      }
      location /inventory/ {
        proxy_pass http://inventory;
      }
      location /tax/ {
        proxy_pass http://tax;
      }
      location /promotion/ {
        proxy_pass http://promotion;
      }
      location /search/ {
        proxy_pass http://search;
      }
      location /payment/ {
        proxy_pass http://payment;
      }
      location /webhook/ {
        proxy_pass http://webhook;
      }
      location /sampledata/ {
        proxy_pass http://sampledata;
      }
      location /recommendation/ {
        proxy_pass http://recommendation;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-api-gateway
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-api-gateway
  template:
    metadata:
      labels:
        app: nginx-api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.3-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: dev
spec:
  selector:
    app: nginx-api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-api-gateway
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: dev-api.yas.local.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: nginx-api-gateway-permissive
  namespace: dev
spec:
  mtls:
    mode: PERMISSIVE
  selector:
    matchLabels:
      app: nginx-api-gateway
