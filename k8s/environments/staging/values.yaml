# Image tag cho môi trường staging
# Chỉ cập nhật khi CI phát hiện tag v1.x.x trên branch main
# Jenkins CI Bot sẽ tự động commit thay đổi vào file này khi có release tag
global:
  imageTag: "v1.0.0"
  imageRepository: "tuandaklak"

# Tắt Ingress của swagger-ui để tránh conflict với production (yas)
swagger-ui:
  ingress:
    enabled: false

storefront-bff:
  ingress:
    enabled: true
    hosts:
      - host: staging-storefront.yas.local.com
        paths:
          - path: /
            pathType: ImplementationSpecific

backoffice-bff:
  ingress:
    enabled: true
    hosts:
      - host: staging-backoffice.yas.local.com
        paths:
          - path: /
            pathType: ImplementationSpecific

# Kiểm soát RAM theo QUY_TAC_RAM_K8S.md
rating:
  backend:
    replicaCount: 0

recommendation:
  backend:
    replicaCount: 0

webhook:
  backend:
    replicaCount: 0

sampledata:
  backend:
    replicaCount: 0

location:
  backend:
    replicaCount: 0
